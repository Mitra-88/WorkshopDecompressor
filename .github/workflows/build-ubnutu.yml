name: Build Ubuntu

permissions:
  contents: read
  actions: write

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'
      - 'Src/**'
      - 'version.txt'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.14.6'
          architecture: 'x64'
          cache: 'pip'

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create virtual environment
        run: python3 -m venv .venv

      - name: Activate virtual environment
        run: source .venv/bin/activate

      - name: Install dependencies
        run: pip install --upgrade -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --console --name "WorkshopDecompressor" --strip --clean --optimize "2" --add-data "Src/core/extract_addons.py:." --add-data "Src/core/extract_archives.py:." --add-data "Src/core/utils.py:." --add-data "Src/core/get_executable.py:."  "Src/core/cli.py"

      - name: Move Bin Folder and Remove Gmad And 7-zip from Windows/macOS
        run: |
          cp -r Src/Bin dist/
          rm -f dist/Bin/Windows/fastgmad.exe
          rm -f dist/Bin/Windows/7z.exe
          rm -f dist/Bin/Darwin/fastgmad
          rm -f dist/Bin/Darwin/7z

      - name: Upload raw artifact
        uses: actions/upload-artifact@v7
        with:
          name: WorkshopDecompressor-${{ steps.sha.outputs.short_sha }}-Linux-x64
          path: dist
          compression-level: 9

      - name: Install linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/WorkshopDecompressor AppDir/usr/bin/
          cp -r dist/Bin AppDir/usr/bin/Bin
          cp Assets/Icon/WorkshopDecompressor.desktop AppDir/
          cp Assets/Icon/WorkshopDecompressor.png AppDir/

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/WorkshopDecompressor \
            --desktop-file Assets/Icon/WorkshopDecompressor.desktop \
            --icon-file Assets/Icon/WorkshopDecompressor.png \
            --output appimage

      - name: Rename AppImage
        run: mv WorkshopDecompressor*.AppImage WorkshopDecompressor-${{ steps.sha.outputs.short_sha }}-Linux-x64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: WorkshopDecompressor-${{ steps.sha.outputs.short_sha }}-Linux-x64-AppImage
          path: WorkshopDecompressor-${{ steps.sha.outputs.short_sha }}-Linux-x64.AppImage
          compression-level: 9
