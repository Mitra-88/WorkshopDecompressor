name: Build Windows

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'
      - 'Src/**'
      - 'version.txt'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
          architecture: 'x64'
          cache: 'pip'

      - name: Get short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create virtual environment
        run: py -m venv .venv

      - name: Install dependencies
        run: .venv\Scripts\python.exe -m pip install --upgrade -r requirements.txt

      - name: Build with PyInstaller
        run: .venv\Scripts\pyinstaller.exe --noconfirm --onefile --console --icon "Assets/Icon/WorkshopDecompressor.ico" --name "WorkshopDecompressor" --clean --optimize "2" --version-file "version.txt"  "Src/Core/cli.py"

      - name: Move Bin Folder and Remove Gmad And 7-zip from Linux/macOS
        run: |
          Copy-Item -Path "Src/Bin" -Destination "dist" -Recurse -Force
          Remove-Item -Path 'dist/Bin/Linux/fastgmad' -Force
          Remove-Item -Path 'dist/Bin/Darwin/fastgmad' -Force
          Remove-Item -Path 'dist/Bin/Linux/7z' -Force
          Remove-Item -Path 'dist/Bin/Darwin/7z' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: WorkshopDecompressor-${{ steps.sha.outputs.short_sha }}-Windows-x64
          path: dist
          compression-level: 9
